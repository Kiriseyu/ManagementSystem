<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人事管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // 在页面渲染前立即设置主题，避免闪屏
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (!localStorage.getItem('theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
</head>
<body>
    <header>
        <div class="container">
            <h1>人事管理系统</h1>
            <div class="header-actions">
                <div id="user-info" class="user-info" style="display: none;">
                    <span id="username-display"></span>
                    <a href="usercenter.html" class="btn btn-secondary btn-sm">个人中心</a>
                    <button class="btn btn-secondary btn-sm" onclick="logout()">退出登录</button>
                </div>
                <div class="theme-toggle" onclick="toggleTheme()">
                    <span class="icon">●</span>
                    <span class="text">深色/浅色</span>
                </div>
            </div>
        </div>
    </header>
    
    <nav id="main-nav">
        <div class="container">
            <ul id="nav-menu">
                <!-- 导航菜单将根据用户角色动态生成 -->
            </ul>
        </div>
    </nav>
    
    <div class="container">
        <div class="content">
            <div class="welcome-section">
                <h2>欢迎使用人事管理系统</h2>
                <p>高效管理您的人力资源，简化人事管理流程</p>
                <div id="version-info" style="font-size: 12px; color: #6b7280; margin-top: 8px;"></div>
                
                <div class="dashboard-cards" id="dashboard-cards">
                    <!-- 功能卡片将根据用户角色动态生成 -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/common.js"></script>
    <script>
        // 管理员导航菜单
        const adminNavMenu = [
            { href: 'index.html', text: '首页', active: true },
            { href: 'employee.html', text: '员工管理' },
            { href: 'department.html', text: '部门管理' },
            { href: 'attendance.html', text: '考勤管理' },
            { href: 'salary.html', text: '薪资管理' },
            { href: 'position.html', text: '职位管理' },
            { href: 'title.html', text: '职称管理' },
            { href: 'performance.html', text: '绩效管理' },
            { href: 'users.html', text: '用户管理' },
            { href: 'log.html', text: '操作日志' }
        ];
        
        // 普通用户导航菜单
        const userNavMenu = [
            { href: 'index.html', text: '首页', active: true },
            { href: 'attendance.html', text: '考勤管理' },
            { href: 'log.html', text: '操作日志' }
        ];
        
        // 管理员功能卡片（两行布局）
        const adminCards = [
            // 第一行
            { href: 'employee.html', title: '员工管理', desc: '管理员工基本信息，支持Excel导入导出' },
            { href: 'department.html', title: '部门管理', desc: '管理公司部门信息，支持树形层级结构' },
            { href: 'attendance.html', title: '考勤管理', desc: '记录和管理员工考勤信息' },
            { href: 'salary.html', title: '薪资管理', desc: '管理员工薪资信息，计算工资发放' },
            // 第二行
            { href: 'position.html', title: '职位管理', desc: '管理公司职位信息，维护职位层级' },
            { href: 'title.html', title: '职称管理', desc: '管理员工职称信息，支持职称评定' },
            { href: 'performance.html', title: '绩效管理', desc: '评估员工绩效，支持绩效打分和排名' },
            { href: 'users.html', title: '用户管理', desc: '管理系统用户账号，支持添加管理员' }
        ];
        
        // 普通用户功能卡片
        const userCards = [
            { href: 'attendance.html', title: '考勤管理', desc: '查看和管理个人考勤记录' },
            { href: 'log.html', title: '操作日志', desc: '查看个人操作历史记录' }
        ];
        
        function checkLogin() {
            const username = sessionStorage.getItem('username');
            const role = sessionStorage.getItem('role');
            
            if (!username) {
                window.location.href = 'login.html';
                return;
            }
            
            // 显示用户信息和角色
            const roleText = role === 'admin' ? '管理员' : '普通用户';
            document.getElementById('username-display').textContent = `欢迎, ${username} (${roleText})`;
            document.getElementById('user-info').style.display = 'flex';
            
            // 根据角色生成导航菜单
            const navMenu = role === 'admin' ? adminNavMenu : userNavMenu;
            const navMenuHtml = navMenu.map(item => 
                `<li><a href="${item.href}" ${item.active ? 'class="active"' : ''}>${item.text}</a></li>`
            ).join('');
            document.getElementById('nav-menu').innerHTML = navMenuHtml;
            
            // 根据角色生成功能卡片
            const cards = role === 'admin' ? adminCards : userCards;
            const cardsHtml = cards.map(card => 
                `<a href="${card.href}" class="card">
                    <h3>${card.title}</h3>
                    <p>${card.desc}</p>
                </a>`
            ).join('');
            document.getElementById('dashboard-cards').innerHTML = cardsHtml;
        }
        
        function logout() {
            fetch('api/logout', { method: 'POST', credentials: 'include' })
                .then(() => {
                    sessionStorage.removeItem('userId');
                    sessionStorage.removeItem('username');
                    sessionStorage.removeItem('role');
                    window.location.href = 'login.html';
                });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            checkLogin();
            loadVersionInfo();
        });
        
        async function loadVersionInfo() {
            try {
                const response = await fetch('api/version');
                const data = await response.json();
                document.getElementById('version-info').textContent = 
                    `版本: ${data.version} | 构建时间: ${data.buildTime} | 服务器时间: ${data.serverTime}`;
            } catch (error) {
                document.getElementById('version-info').textContent = '';
            }
        }
    </script>
</body>
</html>
