<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考勤管理 - 人事管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // 在页面渲染前立即设置主题，避免闪屏
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (!localStorage.getItem('theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
</head>
<body>
    <header>
        <div class="container">
            <h1>人事管理系统</h1>
            <div class="header-actions">
                <div id="user-info" class="user-info" style="display: none;">
                    <span id="username-display"></span>
                    <a href="usercenter.html" class="btn btn-secondary btn-sm">个人中心</a>
                    <button class="btn btn-secondary btn-sm" onclick="logout()">退出登录</button>
                </div>
                <div class="theme-toggle" onclick="toggleTheme()">
                    <span class="icon">●</span>
                    <span class="text">深色/浅色</span>
                </div>
            </div>
        </div>
    </header>
    
    <nav>
        <div class="container">
            <ul id="nav-menu">
                <!-- 导航菜单将根据用户角色动态生成 -->
            </ul>
        </div>
    </nav>
    
    <div class="container">
        <div class="content">
            <h2 class="page-title">考勤管理</h2>
            
            <div class="toolbar">
                <button class="btn btn-primary" onclick="openAddModal()">+ 添加考勤</button>
            </div>
            
            <table id="attendanceTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>员工</th>
                        <th>考勤日期</th>
                        <th>签到时间</th>
                        <th>签退时间</th>
                        <th>状态</th>
                        <th>备注</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody"></tbody>
            </table>
        </div>
    </div>
    
    <div id="attendanceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">添加考勤</h2>
                <span class="close" onclick="hideModal('attendanceModal')">&times;</span>
            </div>
            <form id="attendanceForm">
                <input type="hidden" id="attId">
                <div class="form-group">
                    <label>员工 *</label>
                    <select id="empId" required>
                        <option value="">请选择</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>考勤日期</label>
                    <input type="date" id="attDate">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>签到时间</label>
                        <input type="datetime-local" id="checkInTime">
                    </div>
                    <div class="form-group">
                        <label>签退时间</label>
                        <input type="datetime-local" id="checkOutTime">
                    </div>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="status">
                        <option value="Normal">正常</option>
                        <option value="Late">迟到</option>
                        <option value="Early">早退</option>
                        <option value="Leave">请假</option>
                        <option value="Absent">旷工</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="remark">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="hideModal('attendanceModal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/common.js"></script>
    <script>
        let attendances = [];
        let employees = [];
        
        async function loadEmployees() {
            try {
                employees = await fetchData('api/employee');
                const select = document.getElementById('empId');
                select.innerHTML = '<option value="">请选择</option>';
                employees.forEach(emp => {
                    select.innerHTML += `<option value="${emp.empId}">${emp.empName}</option>`;
                });
            } catch (e) {}
        }
        
        async function loadAttendances() {
            try {
                attendances = await fetchData('api/attendance');
                renderAttendances();
            } catch (e) {}
        }
        
        function renderAttendances() {
            const tbody = document.getElementById('attendanceTableBody');
            tbody.innerHTML = '';
            attendances.forEach(att => {
                const emp = employees.find(e => e.empId === att.empId);
                tbody.innerHTML += `
                    <tr>
                        <td>${att.attId}</td>
                        <td>${emp ? emp.empName : '-'}</td>
                        <td>${formatDate(att.attDate)}</td>
                        <td>${formatDateTime(att.checkInTime)}</td>
                        <td>${formatDateTime(att.checkOutTime)}</td>
                        <td>${statusMap(att.status)}</td>
                        <td>${att.remark}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-warning btn-sm" onclick="openEditModal(${att.attId})">编辑</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteAttendance(${att.attId})">删除</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }
        
        function openAddModal() {
            document.getElementById('modalTitle').textContent = '添加考勤';
            document.getElementById('attendanceForm').reset();
            document.getElementById('attId').value = '';
            showModal('attendanceModal');
        }
        
        async function openEditModal(id) {
            try {
                const att = await fetchData(`api/attendance?id=${id}`);
                document.getElementById('modalTitle').textContent = '编辑考勤';
                document.getElementById('attId').value = att.attId;
                document.getElementById('empId').value = att.empId;
                document.getElementById('attDate').value = formatDate(att.attDate);
                document.getElementById('checkInTime').value = att.checkInTime ? att.checkInTime.replace(' ', 'T') : '';
                document.getElementById('checkOutTime').value = att.checkOutTime ? att.checkOutTime.replace(' ', 'T') : '';
                document.getElementById('status').value = att.status;
                document.getElementById('remark').value = att.remark;
                showModal('attendanceModal');
            } catch (e) {}
        }
        
        async function deleteAttendance(id) {
            if (!confirm('确定要删除该考勤记录吗？')) return;
            try {
                await fetchData(`api/attendance?id=${id}`, { method: 'DELETE' });
                showMessage('删除成功');
                loadAttendances();
            } catch (e) {}
        }
        
        document.getElementById('attendanceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const attId = document.getElementById('attId').value;
            const formData = new URLSearchParams();
            formData.append('empId', document.getElementById('empId').value);
            formData.append('attDate', document.getElementById('attDate').value);
            formData.append('checkInTime', document.getElementById('checkInTime').value.replace('T', ' '));
            formData.append('checkOutTime', document.getElementById('checkOutTime').value.replace('T', ' '));
            formData.append('status', document.getElementById('status').value);
            formData.append('remark', document.getElementById('remark').value);
            
            try {
                if (attId) {
                    formData.append('attId', attId);
                    await fetchData('api/attendance', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData
                    });
                    showMessage('更新成功');
                } else {
                    await fetchData('api/attendance', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData
                    });
                    showMessage('添加成功');
                }
                hideModal('attendanceModal');
                loadAttendances();
            } catch (e) {}
        });
        
        // 管理员导航菜单
        const adminNavMenu = [
            { href: 'index.html', text: '首页' },
            { href: 'employee.html', text: '员工管理' },
            { href: 'department.html', text: '部门管理' },
            { href: 'attendance.html', text: '考勤管理', active: true },
            { href: 'salary.html', text: '薪资管理' },
            { href: 'position.html', text: '职位管理' },
            { href: 'title.html', text: '职称管理' },
            { href: 'performance.html', text: '绩效管理' },
            { href: 'users.html', text: '用户管理' },
            { href: 'log.html', text: '操作日志' }
        ];
        
        // 普通用户导航菜单
        const userNavMenu = [
            { href: 'index.html', text: '首页' },
            { href: 'attendance.html', text: '考勤管理', active: true },
            { href: 'log.html', text: '操作日志' }
        ];
        
        function checkLogin() {
            const username = sessionStorage.getItem('username');
            const role = sessionStorage.getItem('role');
            
            if (!username) {
                window.location.href = 'login.html';
                return false;
            }
            
            // 显示用户信息
            const roleText = role === 'admin' ? '管理员' : '普通用户';
            document.getElementById('username-display').textContent = `欢迎, ${username} (${roleText})`;
            document.getElementById('user-info').style.display = 'flex';
            
            // 根据角色生成导航菜单
            const navMenu = role === 'admin' ? adminNavMenu : userNavMenu;
            const navMenuHtml = navMenu.map(item => 
                `<li><a href="${item.href}" ${item.active ? 'class="active"' : ''}>${item.text}</a></li>`
            ).join('');
            document.getElementById('nav-menu').innerHTML = navMenuHtml;
            
            return true;
        }
        
        function logout() {
            fetch('api/logout', { method: 'POST', credentials: 'include' })
                .then(() => {
                    sessionStorage.removeItem('userId');
                    sessionStorage.removeItem('username');
                    sessionStorage.removeItem('role');
                    window.location.href = 'login.html';
                });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            initBackToTop();
            
            if (typeof checkLogin === 'function') {
                const isLoggedIn = checkLogin();
                if (isLoggedIn) {
                    loadEmployees().then(() => {
                        loadAttendances();
                    });
                }
            } else {
                loadEmployees().then(() => {
                    loadAttendances();
                });
            }
        });
    </script>
</body>
</html>
