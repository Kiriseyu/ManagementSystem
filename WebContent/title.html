<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职称管理 - 人事管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (!localStorage.getItem('theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
</head>
<body>
    <header>
        <div class="container">
            <h1>人事管理系统</h1>
            <div class="header-actions">
                <div id="user-info" class="user-info" style="display: none;">
                    <span id="username-display"></span>
                    <button class="btn btn-secondary btn-sm" onclick="logout()">退出登录</button>
                </div>
                <div class="theme-toggle" onclick="toggleTheme()">
                    <span class="icon">●</span>
                    <span class="text">深色/浅色</span>
                </div>
            </div>
        </div>
    </header>
    
    <nav>
        <div class="container">
            <ul id="nav-menu">
                <!-- 导航菜单将根据用户角色动态生成 -->
            </ul>
        </div>
    </nav>
    
    <div class="container">
        <div class="content">
            <h2 class="page-title">职称管理</h2>
            
            <div class="toolbar">
                <button class="btn btn-primary" onclick="showAddModal()">添加职称</button>
            </div>
            
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>职称名称</th>
                        <th>职称等级</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="titleTableBody">
                    <!-- 数据将通过JavaScript加载 -->
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- 添加/编辑模态框 -->
    <div id="titleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加职称</h3>
                <span class="close" onclick="hideModal('titleModal')">&times;</span>
            </div>
            <form id="titleForm">
                <input type="hidden" id="titleId">
                <div class="form-group">
                    <label>职称名称</label>
                    <input type="text" id="titleName" required>
                </div>
                <div class="form-group">
                    <label>职称等级</label>
                    <select id="titleLevel" required>
                        <option value="初级">初级</option>
                        <option value="中级">中级</option>
                        <option value="副高级">副高级</option>
                        <option value="高级">高级</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="titleStatus">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="hideModal('titleModal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="backToTop" class="back-to-top" onclick="scrollToTop()">↑</div>
    
    <script src="js/common.js"></script>
    <script>
        let titles = [];
        
        async function loadTitles() {
            try {
                titles = await fetchData('api/title');
                renderTitles();
            } catch (e) {
                console.error('加载职称失败:', e);
                showMessage('加载职称失败', 'error');
            }
        }
        
        function renderTitles() {
            const tbody = document.getElementById('titleTableBody');
            tbody.innerHTML = '';
            
            if (!titles || titles.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">暂无数据</td></tr>';
                return;
            }
            
            titles.forEach(title => {
                tbody.innerHTML += `
                    <tr>
                        <td>${title.titleId}</td>
                        <td>${title.titleName}</td>
                        <td>${title.titleLevel}</td>
                        <td>${title.status === 1 ? '<span class="status active">启用</span>' : '<span class="status inactive">禁用</span>'}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-warning btn-sm" onclick="showEditModal(${title.titleId})">编辑</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteTitle(${title.titleId})">删除</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }
        
        function showAddModal() {
            document.getElementById('modalTitle').textContent = '添加职称';
            document.getElementById('titleId').value = '';
            document.getElementById('titleForm').reset();
            document.getElementById('titleLevel').value = '初级';
            document.getElementById('titleStatus').value = '1';
            showModal('titleModal');
        }
        
        function showEditModal(titleId) {
            const title = titles.find(t => t.titleId === titleId);
            if (!title) return;
            
            document.getElementById('modalTitle').textContent = '编辑职称';
            document.getElementById('titleId').value = title.titleId;
            document.getElementById('titleName').value = title.titleName;
            document.getElementById('titleLevel').value = title.titleLevel;
            document.getElementById('titleStatus').value = title.status;
            showModal('titleModal');
        }
        
        document.getElementById('titleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const titleId = document.getElementById('titleId').value;
            const titleName = document.getElementById('titleName').value;
            const titleLevel = document.getElementById('titleLevel').value;
            const titleStatus = document.getElementById('titleStatus').value;
            
            try {
                if (titleId) {
                    await fetchData('api/title', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ titleId, titleName, titleLevel, status: titleStatus })
                    });
                    showMessage('职称更新成功');
                } else {
                    await fetchData('api/title', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ titleName, titleLevel })
                    });
                    showMessage('职称添加成功');
                }
                hideModal('titleModal');
                loadTitles();
            } catch (e) {
                console.error('保存失败:', e);
                showMessage(e.message || '保存失败', 'error');
            }
        });
        
        async function deleteTitle(titleId) {
            if (!confirm('确定要删除该职称吗？')) return;
            
            try {
                await fetchData(`api/title?id=${titleId}`, { method: 'DELETE' });
                showMessage('职称删除成功');
                loadTitles();
            } catch (e) {
                console.error('删除失败:', e);
                showMessage('删除失败', 'error');
            }
        }
        
        // 管理员导航菜单
        const adminNavMenu = [
            { href: 'index.html', text: '首页' },
            { href: 'employee.html', text: '员工管理' },
            { href: 'department.html', text: '部门管理' },
            { href: 'attendance.html', text: '考勤管理' },
            { href: 'salary.html', text: '薪资管理' },
            { href: 'position.html', text: '职位管理' },
            { href: 'title.html', text: '职称管理', active: true },
            { href: 'performance.html', text: '绩效管理' },
            { href: 'users.html', text: '用户管理' },
            { href: 'log.html', text: '操作日志' }
        ];
        
        // 普通用户导航菜单
        const userNavMenu = [
            { href: 'index.html', text: '首页' },
            { href: 'attendance.html', text: '考勤管理' },
            { href: 'log.html', text: '操作日志' }
        ];
        
        function checkLogin() {
            const username = sessionStorage.getItem('username');
            const role = sessionStorage.getItem('role');
            
            if (!username) {
                window.location.href = 'login.html';
                return false;
            }
            
            const roleText = role === 'admin' ? '管理员' : '普通用户';
            document.getElementById('username-display').textContent = `欢迎, ${username} (${roleText})`;
            document.getElementById('user-info').style.display = 'flex';
            
            const navMenu = role === 'admin' ? adminNavMenu : userNavMenu;
            const navMenuHtml = navMenu.map(item => 
                `<li><a href="${item.href}" ${item.active ? 'class="active"' : ''}>${item.text}</a></li>`
            ).join('');
            document.getElementById('nav-menu').innerHTML = navMenuHtml;
            
            return true;
        }
        
        function logout() {
            fetch('api/logout', { method: 'POST', credentials: 'include' })
                .then(() => {
                    sessionStorage.removeItem('userId');
                    sessionStorage.removeItem('username');
                    sessionStorage.removeItem('role');
                    window.location.href = 'login.html';
                });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            initBackToTop();
            if (typeof checkLogin === 'function' && checkLogin()) {
                loadTitles();
            }
        });
    </script>
    
    <style>
        .status {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .status.active { background: #4caf50; color: white; }
        .status.inactive { background: #999; color: white; }
    </style>
</body>
</html>
