<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理 - 人事管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>人事管理系统</h1>
            <div class="theme-toggle" onclick="toggleTheme()">
                <span class="icon">●</span>
                <span class="text">深色/浅色</span>
            </div>
        </div>
    </header>
    
    <nav>
        <div class="container">
            <ul>
                <li><a href="index.html" onclick="navigateTo('index.html')">首页</a></li>
                <li><a href="employee.html" class="active" onclick="navigateTo('employee.html')">员工管理</a></li>
                <li><a href="department.html" onclick="navigateTo('department.html')">部门管理</a></li>
                <li><a href="attendance.html" onclick="navigateTo('attendance.html')">考勤管理</a></li>
                <li><a href="salary.html" onclick="navigateTo('salary.html')">薪资管理</a></li>
            </ul>
        </div>
    </nav>
    
    <div class="container">
        <div class="content">
            <h2 class="page-title">员工管理</h2>
            
            <div class="toolbar">
                <button class="btn btn-primary" onclick="openAddModal()">+ 添加员工</button>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索员工姓名...">
                    <button class="btn btn-secondary" onclick="searchEmployees()">搜索</button>
                </div>
            </div>
            
            <table id="employeeTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>出生日期</th>
                        <th>电话</th>
                        <th>邮箱</th>
                        <th>部门</th>
                        <th>入职日期</th>
                        <th>职位</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody"></tbody>
            </table>
        </div>
    </div>
    
    <div id="employeeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">添加员工</h2>
                <span class="close" onclick="hideModal('employeeModal')">&times;</span>
            </div>
            <form id="employeeForm">
                <input type="hidden" id="empId">
                <div class="form-group">
                    <label>姓名 *</label>
                    <input type="text" id="empName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>性别</label>
                        <select id="empGender">
                            <option value="M">男</option>
                            <option value="F">女</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>出生日期</label>
                        <input type="date" id="empBirthdate">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>电话</label>
                        <input type="text" id="empPhone">
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="empEmail">
                    </div>
                </div>
                <div class="form-group">
                    <label>地址</label>
                    <input type="text" id="empAddress">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>部门</label>
                        <select id="deptId">
                            <option value="">请选择</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>入职日期</label>
                        <input type="date" id="hireDate">
                    </div>
                </div>
                <div class="form-group">
                    <label>职位</label>
                    <input type="text" id="jobTitle">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="hideModal('employeeModal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/common.js"></script>
    <script>
        let employees = [];
        let departments = [];
        
        async function loadDepartments() {
            try {
                departments = await fetchData('api/department');
                const select = document.getElementById('deptId');
                select.innerHTML = '<option value="">请选择</option>';
                departments.forEach(dept => {
                    select.innerHTML += `<option value="${dept.deptId}">${dept.deptName}</option>`;
                });
            } catch (e) {}
        }
        
        async function loadEmployees() {
            try {
                employees = await fetchData('api/employee');
                renderEmployees();
            } catch (e) {}
        }
        
        function renderEmployees() {
            const tbody = document.getElementById('employeeTableBody');
            tbody.innerHTML = '';
            employees.forEach(emp => {
                const dept = departments.find(d => d.deptId === emp.deptId);
                tbody.innerHTML += `
                    <tr>
                        <td>${emp.empId}</td>
                        <td>${emp.empName}</td>
                        <td>${genderMap(emp.empGender)}</td>
                        <td>${formatDate(emp.empBirthdate)}</td>
                        <td>${emp.empPhone}</td>
                        <td>${emp.empEmail}</td>
                        <td>${dept ? dept.deptName : '-'}</td>
                        <td>${formatDate(emp.hireDate)}</td>
                        <td>${emp.jobTitle}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-warning btn-sm" onclick="openEditModal(${emp.empId})">编辑</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteEmployee(${emp.empId})">删除</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }
        
        function searchEmployees() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = employees.filter(emp => 
                emp.empName.toLowerCase().includes(keyword)
            );
            const tbody = document.getElementById('employeeTableBody');
            tbody.innerHTML = '';
            filtered.forEach(emp => {
                const dept = departments.find(d => d.deptId === emp.deptId);
                tbody.innerHTML += `
                    <tr>
                        <td>${emp.empId}</td>
                        <td>${emp.empName}</td>
                        <td>${genderMap(emp.empGender)}</td>
                        <td>${formatDate(emp.empBirthdate)}</td>
                        <td>${emp.empPhone}</td>
                        <td>${emp.empEmail}</td>
                        <td>${dept ? dept.deptName : '-'}</td>
                        <td>${formatDate(emp.hireDate)}</td>
                        <td>${emp.jobTitle}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-warning btn-sm" onclick="openEditModal(${emp.empId})">编辑</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteEmployee(${emp.empId})">删除</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }
        
        function openAddModal() {
            document.getElementById('modalTitle').textContent = '添加员工';
            document.getElementById('employeeForm').reset();
            document.getElementById('empId').value = '';
            showModal('employeeModal');
        }
        
        async function openEditModal(id) {
            try {
                const emp = await fetchData(`api/employee?id=${id}`);
                document.getElementById('modalTitle').textContent = '编辑员工';
                document.getElementById('empId').value = emp.empId;
                document.getElementById('empName').value = emp.empName;
                document.getElementById('empGender').value = emp.empGender;
                document.getElementById('empBirthdate').value = formatDate(emp.empBirthdate);
                document.getElementById('empPhone').value = emp.empPhone;
                document.getElementById('empEmail').value = emp.empEmail;
                document.getElementById('empAddress').value = emp.empAddress;
                document.getElementById('deptId').value = emp.deptId || '';
                document.getElementById('hireDate').value = formatDate(emp.hireDate);
                document.getElementById('jobTitle').value = emp.jobTitle;
                showModal('employeeModal');
            } catch (e) {}
        }
        
        async function deleteEmployee(id) {
            if (!confirm('确定要删除该员工吗？')) return;
            try {
                await fetchData(`api/employee?id=${id}`, { method: 'DELETE' });
                showMessage('删除成功');
                loadEmployees();
            } catch (e) {}
        }
        
        document.getElementById('employeeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const empId = document.getElementById('empId').value;
            const formData = new URLSearchParams();
            formData.append('empName', document.getElementById('empName').value);
            formData.append('empGender', document.getElementById('empGender').value);
            formData.append('empBirthdate', document.getElementById('empBirthdate').value);
            formData.append('empPhone', document.getElementById('empPhone').value);
            formData.append('empEmail', document.getElementById('empEmail').value);
            formData.append('empAddress', document.getElementById('empAddress').value);
            formData.append('deptId', document.getElementById('deptId').value);
            formData.append('hireDate', document.getElementById('hireDate').value);
            formData.append('jobTitle', document.getElementById('jobTitle').value);
            
            try {
                if (empId) {
                    formData.append('empId', empId);
                    await fetchData('api/employee', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData
                    });
                    showMessage('更新成功');
                } else {
                    await fetchData('api/employee', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData
                    });
                    showMessage('添加成功');
                }
                hideModal('employeeModal');
                loadEmployees();
            } catch (e) {}
        });
        
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            // 尝试检查登录，如果未登录也尝试加载数据（用于调试）
            if (typeof checkLogin === 'function') {
                const isLoggedIn = checkLogin();
                if (isLoggedIn) {
                    loadDepartments();
                    loadEmployees();
                } else {
                    // 未登录状态下也尝试加载数据（调试模式）
                    loadDepartments();
                    loadEmployees();
                }
            } else {
                // checkLogin 未定义，直接加载数据
                loadDepartments();
                loadEmployees();
            }
        });
    </script>
</body>
</html>
