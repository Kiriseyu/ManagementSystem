<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门管理 - 人事管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // 在页面渲染前立即设置主题，避免闪屏
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            // 如果用户偏好暗色且未设置主题，使用暗色
            if (!localStorage.getItem('theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
</head>
<body>
    <header>
        <div class="container">
            <h1>人事管理系统</h1>
            <div class="theme-toggle" onclick="toggleTheme()">
                <span class="icon">●</span>
                <span class="text">深色/浅色</span>
            </div>
        </div>
    </header>
    
    <nav>
        <div class="container">
            <ul>
                <li><a href="index.html" onclick="navigateTo('index.html')">首页</a></li>
                <li><a href="employee.html" onclick="navigateTo('employee.html')">员工管理</a></li>
                <li><a href="department.html" class="active" onclick="navigateTo('department.html')">部门管理</a></li>
                <li><a href="attendance.html" onclick="navigateTo('attendance.html')">考勤管理</a></li>
                <li><a href="salary.html" onclick="navigateTo('salary.html')">薪资管理</a></li>
                <li><a href="position.html" onclick="navigateTo('position.html')">职位管理</a></li>
                <li><a href="title.html" onclick="navigateTo('title.html')">职称管理</a></li>
                <li><a href="performance.html" onclick="navigateTo('performance.html')">绩效管理</a></li>
                <li><a href="log.html" onclick="navigateTo('log.html')">操作日志</a></li>
                <li><a href="usercenter.html" onclick="navigateTo('usercenter.html')">个人中心</a></li>
            </ul>
        </div>
    </nav>
    
    <div class="container">
        <div class="content">
            <h2 class="page-title">部门管理</h2>
            
            <div class="toolbar">
                <button class="btn btn-primary" onclick="openAddModal()">+ 添加部门</button>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索部门名称...">
                    <button class="btn btn-secondary" onclick="searchDepartments()">搜索</button>
                </div>
            </div>
            
            <table id="departmentTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>部门名称</th>
                        <th>位置</th>
                        <th>电话</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="departmentTableBody"></tbody>
            </table>
        </div>
    </div>
    
    <div id="departmentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">添加部门</h2>
                <span class="close" onclick="hideModal('departmentModal')">&times;</span>
            </div>
            <form id="departmentForm">
                <input type="hidden" id="deptId">
                <div class="form-group">
                    <label>部门名称 *</label>
                    <input type="text" id="deptName" required>
                </div>
                <div class="form-group">
                    <label>位置</label>
                    <input type="text" id="deptLocation">
                </div>
                <div class="form-group">
                    <label>电话</label>
                    <input type="text" id="deptPhone">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="hideModal('departmentModal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/common.js"></script>
    <script>
        let departments = [];
        
        async function loadDepartments() {
            try {
                departments = await fetchData('api/department');
                renderDepartments();
            } catch (e) {}
        }
        
        function renderDepartments() {
            const tbody = document.getElementById('departmentTableBody');
            tbody.innerHTML = '';
            departments.forEach(dept => {
                tbody.innerHTML += `
                    <tr>
                        <td>${dept.deptId}</td>
                        <td>${dept.deptName}</td>
                        <td>${dept.deptLocation}</td>
                        <td>${dept.deptPhone}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-warning btn-sm" onclick="openEditModal(${dept.deptId})">编辑</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteDepartment(${dept.deptId})">删除</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }
        
        function searchDepartments() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = departments.filter(dept => 
                dept.deptName.toLowerCase().includes(keyword)
            );
            const tbody = document.getElementById('departmentTableBody');
            tbody.innerHTML = '';
            filtered.forEach(dept => {
                tbody.innerHTML += `
                    <tr>
                        <td>${dept.deptId}</td>
                        <td>${dept.deptName}</td>
                        <td>${dept.deptLocation}</td>
                        <td>${dept.deptPhone}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-warning btn-sm" onclick="openEditModal(${dept.deptId})">编辑</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteDepartment(${dept.deptId})">删除</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }
        
        function openAddModal() {
            document.getElementById('modalTitle').textContent = '添加部门';
            document.getElementById('departmentForm').reset();
            document.getElementById('deptId').value = '';
            showModal('departmentModal');
        }
        
        async function openEditModal(id) {
            try {
                const dept = await fetchData(`api/department?id=${id}`);
                document.getElementById('modalTitle').textContent = '编辑部门';
                document.getElementById('deptId').value = dept.deptId;
                document.getElementById('deptName').value = dept.deptName;
                document.getElementById('deptLocation').value = dept.deptLocation;
                document.getElementById('deptPhone').value = dept.deptPhone;
                showModal('departmentModal');
            } catch (e) {}
        }
        
        async function deleteDepartment(id) {
            if (!confirm('确定要删除该部门吗？')) return;
            try {
                await fetchData(`api/department?id=${id}`, { method: 'DELETE' });
                showMessage('删除成功');
                loadDepartments();
            } catch (e) {}
        }
        
        document.getElementById('departmentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const deptId = document.getElementById('deptId').value;
            const formData = new URLSearchParams();
            formData.append('deptName', document.getElementById('deptName').value);
            formData.append('deptLocation', document.getElementById('deptLocation').value);
            formData.append('deptPhone', document.getElementById('deptPhone').value);
            
            try {
                if (deptId) {
                    formData.append('deptId', deptId);
                    await fetchData('api/department', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData
                    });
                    showMessage('更新成功');
                } else {
                    await fetchData('api/department', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData
                    });
                    showMessage('添加成功');
                }
                hideModal('departmentModal');
                loadDepartments();
            } catch (e) {}
        });
        
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            // 尝试检查登录，如果未登录也尝试加载数据（用于调试）
            if (typeof checkLogin === 'function') {
                const isLoggedIn = checkLogin();
                if (isLoggedIn) {
                    loadDepartments();
                } else {
                    // 未登录状态下也尝试加载数据（调试模式）
                    loadDepartments();
                }
            } else {
                // checkLogin 未定义，直接加载数据
                loadDepartments();
            }
        });
    </script>
</body>
</html>
